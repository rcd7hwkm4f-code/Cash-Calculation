<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>レジ精算票</title>
<style>
  :root{
    --page-bg: #16213E;
    --page-bg-2: #0F1830;
    --paper: #EDEFE7;
    --paper-shadow: rgba(0,0,0,0.35);
    --ink: #1B2A41;
    --ink-soft: #55607A;
    --line: #C9CABB;
    --copper: #B8763B;
    --copper-dark: #93582A;
    --good: #3D6B4A;
    --bad: #B4483C;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    min-height:100vh;
    background: radial-gradient(circle at 50% 0%, var(--page-bg) 0%, var(--page-bg-2) 100%);
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    color: var(--ink);
    padding: 28px 14px 60px;
  }
  .wrap{ max-width: 420px; margin: 0 auto; }
  .title{
    text-align:center;
    color:#EDEFE7;
    font-size: 15px;
    letter-spacing: 0.04em;
    margin-bottom: 18px;
    opacity: 0.85;
  }
  .title .version{
    font-size: 11px;
    color: rgba(237,239,231,0.55);
    letter-spacing: 0.02em;
    margin-left: 6px;
  }
  .receipt{
    background: var(--paper);
    padding: 26px 22px 34px;
    position: relative;
    box-shadow: 0 18px 40px var(--paper-shadow);
  }
  .receipt::after{
    content:"";
    position:absolute; left:0; right:0; bottom:-13px; height:13px;
    background-image:
      linear-gradient(135deg, var(--page-bg-2) 50%, transparent 50%),
      linear-gradient(225deg, var(--page-bg-2) 50%, transparent 50%);
    background-size: 18px 13px, 18px 13px;
    background-position: 0 0, 9px 0;
    background-repeat: repeat-x;
  }
  h1{
    font-size: 20px;
    margin: 0 0 4px;
    text-align:center;
    letter-spacing: 0.02em;
  }
  .date-row{
    display:flex; justify-content:center; margin-bottom: 20px;
  }
  .date-row input[type=date]{
    border:none; background:transparent; font-size:14px; color:var(--ink-soft);
    font-family:inherit; text-align:center;
  }
  .section{
    padding: 14px 0;
    border-bottom: 1px dashed var(--line);
  }
  .section:last-of-type{ border-bottom: none; }
  .label{
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }
  .field-row{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 8px;
    gap: 10px;
  }
  .field-row span{ font-size: 14px; flex-shrink:0; }
  .field-row input{
    flex:1;
    border: none;
    border-bottom: 1px solid var(--line);
    background: transparent;
    text-align: right;
    font-family: "SF Mono","Consolas","Menlo",monospace;
    font-size: 16px;
    padding: 6px 2px;
    color: var(--ink);
    min-width: 0;
  }
  .field-row input:focus{ outline:none; border-bottom-color: var(--copper); }
  .field-row input[readonly]{ color: var(--ink-soft); }
  .yen{ font-size: 13px; color: var(--ink-soft); margin-left:4px; }

  .receipt-row{
    display:flex; align-items:center; gap:8px; margin-bottom: 8px;
  }
  .receipt-row input{
    flex:1;
    border:none; border-bottom:1px solid var(--line);
    background:transparent; text-align:right;
    font-family:"SF Mono","Consolas","Menlo",monospace;
    font-size:16px; padding:6px 2px; color:var(--ink);
  }
  .receipt-row input:focus{ outline:none; border-bottom-color: var(--copper); }
  .remove-btn{
    width:30px; height:30px; flex-shrink:0;
    border:none; background:transparent; color:var(--ink-soft);
    font-size:18px; cursor:pointer; line-height:1;
  }
  .add-btn{
    display:block; width:100%; margin-top:6px;
    padding: 10px; border: 1px dashed var(--line);
    background:transparent; color: var(--copper-dark);
    font-size:14px; border-radius:2px; cursor:pointer;
  }
  .add-btn.ocr-btn{
    border: 1px solid var(--copper);
    color: var(--copper-dark);
    font-weight: 500;
  }
  .ocr-status{
    text-align:center; font-size:12px; color: var(--ink-soft);
    min-height: 16px; margin-top: 6px;
  }
  .subtotal{
    display:flex; justify-content:space-between; margin-top:10px;
    font-size:13px; color:var(--ink-soft);
  }

  .result-row{
    display:flex; justify-content:space-between; align-items:baseline;
    padding: 6px 0; font-size:14px; color: var(--ink-soft);
  }
  .result-row .val{
    font-family:"SF Mono","Consolas","Menlo",monospace;
    color: var(--ink);
    font-size:15px;
  }
  .result-final{
    display:flex; justify-content:space-between; align-items:baseline;
    padding-top: 14px; margin-top: 6px;
    border-top: 1px solid var(--ink);
  }
  .result-final .label-final{ font-size:15px; }
  .result-final .val-final{
    font-family:"SF Mono","Consolas","Menlo",monospace;
    font-size: 26px; font-weight:600; color: var(--copper-dark);
  }

  .calc-row{
    display:flex; justify-content:space-between; align-items:baseline;
    padding: 6px 0; font-size:14px; color: var(--ink-soft);
  }
  .calc-row .calc-val{
    font-family:"SF Mono","Consolas","Menlo",monospace;
    color: var(--ink); font-size:15px;
  }
  .calc-input-row input{
    border:none; border-bottom:1px solid var(--line); background:transparent;
    text-align:right; font-family:"SF Mono","Consolas","Menlo",monospace;
    font-size:16px; padding:4px 2px; color:var(--ink); width:130px;
  }
  .calc-input-row input:focus{ outline:none; border-bottom-color: var(--copper); }
  .calc-line{ border-top: 1px solid var(--ink); margin: 6px 0 2px; }
  .calc-final{ padding-top: 8px; }
  .calc-final span:first-child{ font-size:15px; color: var(--ink); }
  .calc-val-final{
    font-family:"SF Mono","Consolas","Menlo",monospace;
    font-size: 26px; font-weight:600; color: var(--copper-dark);
  }

  .save-btn{
    display:block; width:100%; margin-top: 20px;
    padding: 14px; border:none; background: var(--ink);
    color: var(--paper); font-size:15px; letter-spacing:0.03em;
    cursor:pointer;
  }
  .save-btn:active{ background: var(--copper-dark); }
  .next-day-btn{
    display:block; width:100%; margin-top: 10px;
    padding: 12px; border: 1px solid var(--ink); background: transparent;
    color: var(--ink); font-size:14px; letter-spacing:0.02em;
    cursor:pointer;
  }
  .next-day-btn:active{ background: rgba(27,42,65,0.08); }
  .status{
    text-align:center; font-size:13px; color: var(--good);
    min-height: 18px; margin-top: 10px; line-height:1.5;
  }

  .history{
    max-width: 420px; margin: 22px auto 0; padding: 0 6px;
  }
  .history h2{
    font-size:13px; color:#C9CABB; font-weight:400; margin-bottom:8px;
  }
  .history-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:8px 4px; font-size:13px; color:#DADCD2;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    cursor:pointer;
  }
  .history-row .hist-right{ display:flex; align-items:center; gap:10px; }
  .history-row .hist-amount{ font-family:"SF Mono","Consolas","Menlo",monospace; }
  .hist-delete{
    width:26px; height:26px; border:none; background:transparent;
    color:#8891A8; font-size:16px; cursor:pointer; line-height:1;
  }
  .hist-delete:active{ color: var(--bad); }
  .empty-note{ font-size:12px; color:#8891A8; text-align:center; padding: 10px 0; }

  .backup-btn.danger{
    border-color: var(--bad); color: #E8B3A9;
  }

  .backup{ max-width:420px; margin: 26px auto 0; padding: 14px 12px; border-top: 1px solid rgba(255,255,255,0.12); }
  .backup h2{ font-size:13px; color:#C9CABB; font-weight:400; margin-bottom:10px; }
  .backup-btn{
    display:block; width:100%; margin-bottom:8px;
    padding: 10px; border: 1px solid #4A5678; background: transparent;
    color: #DADCD2; font-size:13px; border-radius:2px; cursor:pointer;
  }
  .backup textarea{
    display:block; width:100%; box-sizing:border-box;
    min-height: 64px; margin-bottom: 10px; padding: 8px;
    background: #0F1830; color:#DADCD2; border:1px solid #4A5678;
    font-family:"SF Mono","Consolas","Menlo",monospace; font-size:12px;
    resize: vertical;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="title">現金精算票（試作ツール）<span class="version">v2</span></div>
  <div class="receipt">
    <h1>本日のレジ精算</h1>
    <div class="date-row"><input type="date" id="dateInput"></div>

    <div class="section">
      <div class="field-row">
        <span>前日からの繰越</span>
        <input type="number" id="prevChange" readonly>
        <span class="yen">円</span>
      </div>
    </div>

    <div class="section">
      <div class="label">本日の売上</div>
      <div class="field-row"><span>店内</span><input type="number" inputmode="decimal" id="storeSales" placeholder="0" autocomplete="off"><span class="yen">円</span></div>
      <div class="field-row"><span>持ち帰り</span><input type="number" inputmode="decimal" id="takeoutSales" placeholder="0" autocomplete="off"><span class="yen">円</span></div>
      <div class="field-row"><span>出前</span><input type="number" inputmode="decimal" id="deliverySales" placeholder="0" autocomplete="off"><span class="yen">円</span></div>
    </div>

    <div class="section">
      <div class="label">本日のレシート（経費）</div>
      <div id="receiptList"></div>
      <button class="add-btn ocr-btn" id="scanReceiptBtn">📷 レシートを撮影して読み取る</button>
      <input type="file" accept="image/*" capture="environment" id="receiptPhotoInput" style="display:none;">
      <div class="ocr-status" id="ocrStatus"></div>
      <button class="add-btn" id="addReceiptBtn">＋ 手入力でレシートを追加</button>
      <div class="subtotal"><span>売上合計</span><span id="salesSubtotal">0円</span></div>
      <div class="subtotal"><span>経費合計</span><span id="expenseSubtotal">0円</span></div>
    </div>

    <div class="section calc-block">
      <div class="calc-row"><span>差引残高</span><span class="calc-val" id="netBalance">0円</span></div>
      <div class="calc-row calc-input-row">
        <span>− 翌日に残す釣り銭</span>
        <input type="number" inputmode="decimal" id="nextChange" placeholder="0" autocomplete="off">
      </div>
      <div class="calc-line"></div>
      <div class="calc-row calc-final">
        <span>事業主出金額</span>
        <span class="calc-val-final" id="withdrawal">0円</span>
      </div>
    </div>

    <button class="save-btn" id="saveBtn">この日を保存する</button>
    <button class="next-day-btn" id="nextDayBtn">翌日の入力に進む →</button>
    <div class="status" id="statusMsg"></div>
  </div>

  <div class="history">
    <h2>最近の記録</h2>
    <div id="historyList"><div class="empty-note">読み込み中…</div></div>
  </div>

  <div class="backup">
    <h2>データの書き出し</h2>
    <button class="backup-btn" id="csvBtn">これまでの記録をCSVでダウンロード</button>
    <div class="empty-note">端末に保存されます。事務所へ送るときに使ってください。</div>
    <button class="backup-btn danger" id="clearAllBtn">すべての履歴を削除</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js"></script>
<script>
const dateInput = document.getElementById('dateInput');
const prevChangeInput = document.getElementById('prevChange');
const storeSales = document.getElementById('storeSales');
const takeoutSales = document.getElementById('takeoutSales');
const deliverySales = document.getElementById('deliverySales');
const nextChangeInput = document.getElementById('nextChange');
const receiptList = document.getElementById('receiptList');
const addReceiptBtn = document.getElementById('addReceiptBtn');
const scanReceiptBtn = document.getElementById('scanReceiptBtn');
const receiptPhotoInput = document.getElementById('receiptPhotoInput');
const ocrStatus = document.getElementById('ocrStatus');
const expenseSubtotal = document.getElementById('expenseSubtotal');
const salesSubtotal = document.getElementById('salesSubtotal');
const netBalanceEl = document.getElementById('netBalance');
const withdrawalEl = document.getElementById('withdrawal');
const saveBtn = document.getElementById('saveBtn');
const nextDayBtn = document.getElementById('nextDayBtn');
const statusMsg = document.getElementById('statusMsg');
const historyList = document.getElementById('historyList');
const csvBtn = document.getElementById('csvBtn');
const clearAllBtn = document.getElementById('clearAllBtn');

const STORAGE_KEY = 'genkin-seisan-history';
let history = [];

function todayISO(){
  const d = new Date();
  const tz = d.getTimezoneOffset()*60000;
  return new Date(d - tz).toISOString().slice(0,10);
}
function yen(n){ return Math.round(n).toLocaleString('ja-JP') + '円'; }

let receiptCounter = 0;
function addReceiptRow(value){
  receiptCounter += 1;
  const uniqueName = 'receipt-' + Date.now() + '-' + receiptCounter;
  const row = document.createElement('div');
  row.className = 'receipt-row';
  row.innerHTML = `
    <input type="text" inputmode="decimal" class="receipt-amount" name="${uniqueName}" placeholder="金額" autocomplete="off">
    <button class="remove-btn" title="削除">×</button>
  `;
  const amountInput = row.querySelector('.receipt-amount');
  amountInput.value = (value !== undefined && value !== null) ? value : '';
  amountInput.addEventListener('input', () => {
    amountInput.value = amountInput.value.replace(/[^0-9.]/g, '');
    recalc();
  });
  row.querySelector('.remove-btn').addEventListener('click', () => {
    row.remove();
    recalc();
  });
  receiptList.appendChild(row);
}

function getReceiptAmounts(){
  return Array.from(document.querySelectorAll('.receipt-amount')).map(i => parseFloat(i.value) || 0);
}

function recalc(){
  const store = parseFloat(storeSales.value) || 0;
  const takeout = parseFloat(takeoutSales.value) || 0;
  const delivery = parseFloat(deliverySales.value) || 0;
  const salesSum = store + takeout + delivery;
  const receiptAmounts = getReceiptAmounts();
  const expenseSum = receiptAmounts.reduce((a,b) => a+b, 0);
  const prevChange = parseFloat(prevChangeInput.value) || 0;
  const nextChange = parseFloat(nextChangeInput.value) || 0;
  const netBalance = prevChange + salesSum - expenseSum;
  const withdrawal = netBalance - nextChange;

  expenseSubtotal.textContent = yen(expenseSum);
  salesSubtotal.textContent = yen(salesSum);
  netBalanceEl.textContent = yen(netBalance);
  withdrawalEl.textContent = yen(withdrawal);
}

async function loadHistory(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    history = raw ? JSON.parse(raw) : [];
  }catch(e){
    history = [];
  }
}

async function saveHistory(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    return { ok:true };
  }catch(e){
    return { ok:false, reason: (e && e.message) ? e.message : String(e) };
  }
}

function findEntry(date){
  return history.find(e => e.date === date);
}
function findPriorEntry(date){
  return history
    .filter(e => e.date < date)
    .sort((a,b) => b.date.localeCompare(a.date))[0];
}

function renderHistory(){
  const recent = [...history].sort((a,b) => b.date.localeCompare(a.date)).slice(0, 8);
  if(recent.length === 0){
    historyList.innerHTML = '<div class="empty-note">まだ記録がありません</div>';
    return;
  }
  historyList.innerHTML = '';
  recent.forEach(e => {
    const row = document.createElement('div');
    row.className = 'history-row';
    row.innerHTML = `
      <span>${e.date}</span>
      <span class="hist-right">
        <span class="hist-amount">${yen(e.withdrawal)}</span>
        <button class="hist-delete" title="この日を削除">×</button>
      </span>
    `;
    row.addEventListener('click', () => {
      dateInput.value = e.date;
      loadForDate(e.date);
    });
    row.querySelector('.hist-delete').addEventListener('click', (evt) => {
      evt.stopPropagation();
      if(!confirm(`${e.date} の記録を削除しますか？`)) return;
      deleteEntry(e.date);
    });
    historyList.appendChild(row);
  });
}

async function deleteEntry(dateStr){
  history = history.filter(e => e.date !== dateStr);
  await saveHistory();
  renderHistory();
  if(dateInput.value === dateStr){
    loadForDate(dateStr);
  }
}

function resetReceiptRows(amounts){
  receiptList.innerHTML = '';
  if(amounts && amounts.length > 0){
    amounts.forEach(a => addReceiptRow(a));
  }else{
    addReceiptRow();
  }
}

function loadForDate(dateStr){
  const existing = findEntry(dateStr);
  if(existing){
    storeSales.value = existing.store || '';
    takeoutSales.value = existing.takeout || '';
    deliverySales.value = existing.delivery || '';
    nextChangeInput.value = existing.nextChange || '';
    prevChangeInput.value = existing.prevChange || 0;
    prevChangeInput.readOnly = true;
    resetReceiptRows(existing.receipts);
    saveBtn.textContent = 'この日の記録を更新する';
  }else{
    storeSales.value = '';
    takeoutSales.value = '';
    deliverySales.value = '';
    nextChangeInput.value = '';
    resetReceiptRows([]);
    const prior = findPriorEntry(dateStr);
    if(prior){
      prevChangeInput.value = prior.nextChange || 0;
      prevChangeInput.readOnly = true;
    }else{
      prevChangeInput.value = '';
      prevChangeInput.readOnly = false;
      prevChangeInput.placeholder = '最初の記録のため手入力';
    }
    saveBtn.textContent = 'この日を保存する';
  }
  recalc();
}

async function onSave(){
  const dateStr = dateInput.value;
  const entry = {
    date: dateStr,
    store: parseFloat(storeSales.value) || 0,
    takeout: parseFloat(takeoutSales.value) || 0,
    delivery: parseFloat(deliverySales.value) || 0,
    receipts: getReceiptAmounts(),
    nextChange: parseFloat(nextChangeInput.value) || 0,
    prevChange: parseFloat(prevChangeInput.value) || 0,
    withdrawal: 0
  };
  const salesSum = entry.store + entry.takeout + entry.delivery;
  const expenseSum = entry.receipts.reduce((a,b)=>a+b,0);
  entry.withdrawal = entry.prevChange + salesSum - expenseSum - entry.nextChange;

  const idx = history.findIndex(e => e.date === dateStr);
  if(idx >= 0) history[idx] = entry; else history.push(entry);

  const result = await saveHistory();
  if(result.ok){
    statusMsg.style.color = 'var(--good)';
    statusMsg.textContent = '保存しました';
    renderHistory();
    setTimeout(() => { statusMsg.textContent=''; }, 2500);
  }else{
    statusMsg.style.color = 'var(--bad)';
    statusMsg.textContent = '保存できませんでした：' + result.reason;
  }
}

dateInput.addEventListener('change', () => loadForDate(dateInput.value));
addReceiptBtn.addEventListener('click', () => { addReceiptRow(); recalc(); });

function isDateLine(line){
  return /\d{4}\s*年/.test(line) ||
         /\d{1,2}\s*月\s*\d{1,2}\s*日/.test(line) ||
         /\d{4}[\/\-]\d{1,2}[\/\-]\d{1,2}/.test(line) ||
         /\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}/.test(line);
}

function extractAmount(text){
  const totalKeywords = ['合計','ごうけい','お会計','総額','お預り'];
  const excludeKeywords = ['TEL','Tel','tel','FAX','Fax','電話','承認','AUTH','Auth','会員','ポイント','取引','伝票','No.','No ','様','カード番号','有効期限','店番','責任者','番号','年'];
  const lines = text.split('\n');
  const candidates = [];
  lines.forEach(line => {
    if(excludeKeywords.some(k => line.includes(k))) return;
    if(isDateLine(line)) return;
    const nums = line.match(/[0-9][0-9,]{1,}/g);
    if(!nums) return;
    const hasTotalKeyword = totalKeywords.some(k => line.includes(k));
    nums.forEach(n => {
      const hasComma = n.includes(',');
      const digitsOnly = n.replace(/,/g, '');
      if(digitsOnly.length > 7) return;
      if(digitsOnly.length === 4 && !hasComma){
        const asYear = parseInt(digitsOnly, 10);
        if(asYear >= 1900 && asYear <= 2099) return;
      }
      const val = parseInt(digitsOnly, 10);
      if(isNaN(val) || val <= 0) return;
      let score = 0;
      if(hasTotalKeyword) score += 10;
      if(hasComma) score += 5;
      candidates.push({ val, score });
    });
  });
  if(candidates.length === 0) return null;
  candidates.sort((a,b) => (b.score - a.score) || (b.val - a.val));
  return candidates[0].val;
}

scanReceiptBtn.addEventListener('click', () => receiptPhotoInput.click());
receiptPhotoInput.addEventListener('change', async (evt) => {
  const file = evt.target.files[0];
  if(!file) return;
  addReceiptRow();
  const rows = receiptList.querySelectorAll('.receipt-amount');
  const targetInput = rows[rows.length - 1];
  targetInput.disabled = true;
  targetInput.placeholder = '読み取り中…';
  ocrStatus.textContent = '画像を解析しています（初回は少し時間がかかります）';
  try{
    const result = await Tesseract.recognize(file, 'jpn+eng');
    const amount = extractAmount(result.data.text || '');
    if(amount !== null){
      targetInput.value = amount;
      ocrStatus.textContent = '読み取りました。金額が正しいか確認してください。';
    }else{
      targetInput.placeholder = '読み取れませんでした';
      ocrStatus.textContent = '合計金額を読み取れませんでした。手入力してください。';
    }
  }catch(e){
    targetInput.placeholder = '読み取り失敗';
    ocrStatus.textContent = '読み取り中にエラーが発生しました。手入力してください。';
  }finally{
    targetInput.disabled = false;
    recalc();
    receiptPhotoInput.value = '';
    setTimeout(() => { ocrStatus.textContent = ''; }, 5000);
  }
});
[storeSales, takeoutSales, deliverySales, nextChangeInput, prevChangeInput].forEach(el => {
  el.addEventListener('input', recalc);
});
function formatISO(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

saveBtn.addEventListener('click', onSave);
clearAllBtn.addEventListener('click', () => {
  if(history.length === 0) return;
  if(!confirm('すべての記録を削除します。この操作は元に戻せません。よろしいですか？')) return;
  history = [];
  saveHistory();
  renderHistory();
  loadForDate(dateInput.value);
});
csvBtn.addEventListener('click', () => {
  const baseHeaders = ['日付','前日繰越','店内売上','持ち帰り売上','出前売上','売上合計','経費合計','差引残高','翌日釣り銭','事業主出金額'];
  const sorted = [...history].sort((a,b) => a.date.localeCompare(b.date));
  const maxReceipts = sorted.reduce((max,e) => Math.max(max, (e.receipts||[]).length), 0);
  const receiptHeaders = Array.from({length: maxReceipts}, (_, i) => `レシート${i+1}`);
  const headers = [...baseHeaders, ...receiptHeaders];
  const rows = sorted.map(e => {
    const salesSum = (e.store||0) + (e.takeout||0) + (e.delivery||0);
    const receipts = e.receipts||[];
    const expenseSum = receipts.reduce((a,b) => a+b, 0);
    const netBal = (e.prevChange||0) + salesSum - expenseSum;
    const base = [e.date, e.prevChange||0, e.store||0, e.takeout||0, e.delivery||0, salesSum, expenseSum, netBal, e.nextChange||0, e.withdrawal||0];
    const receiptCells = Array.from({length: maxReceipts}, (_, i) => receipts[i] !== undefined ? receipts[i] : '');
    return [...base, ...receiptCells];
  });
  const csvLines = [headers, ...rows].map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(','));
  const csv = '\uFEFF' + csvLines.join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `genkin-seisan_${todayISO()}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});
nextDayBtn.addEventListener('click', () => {
  const current = new Date(dateInput.value + 'T00:00:00');
  current.setDate(current.getDate() + 1);
  dateInput.value = formatISO(current);
  loadForDate(dateInput.value);
  statusMsg.textContent = '';
});

(async function init(){
  dateInput.value = todayISO();
  await loadHistory();
  loadForDate(dateInput.value);
  renderHistory();
})();
</script>
